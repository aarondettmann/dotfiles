# Activate with `pre-commit install` (done by scripts/bootstrap.sh); it
# installs the hooks of both types
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: forbidden-patterns
        name: Forbidden personal patterns
        entry: scripts/check-forbidden-patterns.sh
        language: script
        types: [text]
        stages: [pre-commit]
      # The same patterns in the commit message
      - id: forbidden-patterns-message
        name: Forbidden personal patterns in the commit message
        entry: scripts/check-forbidden-patterns.sh
        language: script
        stages: [commit-msg]
