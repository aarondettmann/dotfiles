name: Config checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

          sudo rm -rf /opt/nvim-linux-x86_64
          curl -fsSL https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz \
            | sudo tar xzf - -C /opt

          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"

      - name: Run config validation
        run: |
          chmod +x ./scripts/validate-config.sh
          ./scripts/validate-config.sh --strict-tools
