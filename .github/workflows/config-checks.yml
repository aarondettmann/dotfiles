name: Config checks

on:
  push:
  pull_request:

jobs:
  validate:
    # The Ubuntu LTS the dotfiles run on (see README.md), so the validated
    # tool versions match. `ubuntu-latest` lags one release behind.
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install validation tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck tmux vim

          ./scripts/update-nvim.sh stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run config validation
        run: ./scripts/validate-config.sh --strict-tools
