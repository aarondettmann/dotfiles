# ----------------------------
#   /\_/\
#  ( o.o )   kitty.conf
#   > ^ <
# ----------------------------

# ----------------------------
# Fonts
# ----------------------------
# Nerd Font symbols are bundled with kitty, so a plain font is sufficient
# (package `fonts-jetbrains-mono`).
font_family family="JetBrains Mono"
font_size 10

disable_ligatures always

# ----------------------------
# Colors / Themes
# ----------------------------
foreground #cdd6f4
background #1e1e2e
cursor #f5e0dc

# ----------------------------
# Window / layout
# ----------------------------
confirm_os_window_close 1

# ----------------------------
# Copy / selection behavior
# ----------------------------
strip_trailing_spaces smart
select_by_word_characters @-./_

# ----------------------------
# Keybindings (only those that differ from the defaults)
# ----------------------------
map ctrl+shift+w close_tab
map ctrl+shift+0 reset_font_size

# ----------------------------
# Scrolling behavior
# ----------------------------
scrollback_lines 10000

# ----------------------------
# OS integration
# ----------------------------
enable_audio_bell no
bell_on_tab no
