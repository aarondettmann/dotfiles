# ===== Basic settings =====

# Prefix Ctrl+S (`stty -ixon` in ~/.bashrc frees it)
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# Sensible defaults
set -g default-terminal tmux-256color
set -g history-limit 50000
set -g mouse on
set -s escape-time 0

set -g base-index 1
set -g pane-base-index 1

set -g mode-keys vi
set -g renumber-windows on

# Clipboard via OSC 52; passthrough for kitty images
set -g set-clipboard on
set -g allow-passthrough on

# Status bar (Tokyo Night colors, as in the tmux extra of
# folke/tokyonight.nvim; kitty uses the same palette)
set -g status-style 'fg=#7aa2f7,bg=#292e42'
set -g message-style 'fg=#7aa2f7,bg=#3b4261'
set -g window-status-current-style 'fg=#16161e,bg=#7aa2f7,bold'
set -g status-left ''
set -g status-right " %a %F %H:%M "
# Rerun interval of the #() commands of the status lines
set -g status-interval 5

# Pane borders
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# Focus events, for autoread in Neovim
set -s focus-events on

# Pass modified keys (S-Enter, C-Tab, ...) to applications that request them
set -s extended-keys on
set -s extended-keys-format csi-u

# Extended keys and OSC 8 links in kitty; fixed index, no duplicate on
# reload
set -s terminal-features[10] 'xterm-kitty:extkeys:hyperlinks'

# ===== Key mappings =====

# Source tmux configuration from an active session
bind r source-file ~/.tmux.conf \; \
    display-message "Reloaded tmux configuration"

# Take WAYLAND_DISPLAY from attaching clients; fixed index, no duplicate
# on reload
set -g 'update-environment[100]' WAYLAND_DISPLAY

bind C-c copy-mode
bind C-v paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Panes: split windows
bind - split-window -v -c '#{pane_current_path}'
bind . split-window -h -c '#{pane_current_path}'
unbind '"'
unbind %

# Panes: adjust size (fine)
bind -r C-Left resize-pane -L 2
bind -r C-Right resize-pane -R 2
bind -r C-Down resize-pane -D 1
bind -r C-Up resize-pane -U 1

# Panes: adjust size (coarse)
bind -r S-Left resize-pane -L 10
bind -r S-Right resize-pane -R 10
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5

# Swap a pane (targeted by pane number) with the current pane
bind s display-panes "swap-pane -t '%%'"

# Panes: break pane out to a new window
bind b break-pane -d

# Panes: navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Windows: create new window
bind c new-window -c "#{pane_current_path}"

# Windows: navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Session: choose session, window or pane interactively
bind C-j choose-tree

# Git: lazygit and tig in a popup; tig status in a repository without
# commits
bind g display-popup -d '#{pane_current_path}' -E -w 95% -h 95% lazygit
bind t display-popup -d '#{pane_current_path}' -EE -w 95% -h 95% 'if git rev-parse --verify -q HEAD >/dev/null; then tig; else tig status; fi'

# Projects: switch to a project's window, or create it
bind P display-popup -E -w 80% -h 60% '~/.local/bin/proj'

# Open the URLs on the current pane in urlscan, in a new window
bind u capture-pane -J -b urlscan \; new-window -n urlscan \
    'tmux save-buffer -b urlscan - | urlscan; tmux delete-buffer -b urlscan'

# ===== Machine-local settings =====

# Last, so that it replaces the settings above; -q: the file is optional
source-file -q ~/.config/tmux/local.conf
