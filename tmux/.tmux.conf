# ===== Basic settings =====

# Prefix key (Ctrl+S; flow control is disabled in ~/.bashrc via `stty -ixon`)
set -g prefix C-s
unbind C-b
bind -r C-s send-prefix

# Sensible defaults
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
set -g history-limit 10000
set -g mouse on
set -s escape-time 0

set -g base-index 1
setw -g pane-base-index 1

setw -g mode-keys vi
set -g renumber-windows on

# Status bar (Tokyo Night colours, as in the tmux extra of
# folke/tokyonight.nvim; kitty uses the same palette)
set -g status-style 'fg=#7aa2f7,bg=#16161e'
set -g message-style 'fg=#7aa2f7,bg=#3b4261'
set -g status-left-length 50
set -g status-right-length 50
set -g status-left ''
set -g status-right " %a %F | %H:%M "
# Rerun interval of the #() commands of the status lines
set -g status-interval 5

# Second status line: left, centre and right segments from scripts in
# ~/.local/bin (full paths, since `#()` runs in the server's environment).
# The centre is aligned to the whole line, so it stays put when the left
# segment changes length; quipu_margin keeps room for the left segment.
set-environment -g GATO_NAME DK
set-environment -g GATO_BIRTHDAY 02-25
set-environment -g GATO_WIDTH 22
%hidden palabra='#(~/.local/bin/palabra --line)'
%hidden quipu_margin=70
%hidden quipu="#(~/.local/bin/quipu --tmux --columns=#{client_width} --interval=#{status-interval} --margin=$quipu_margin)"
%hidden gato='#(~/.local/bin/gato --tmux)'
set -g status 2
set -g 'status-format[1]' "#[fg=#c0caf5,bg=#292e42,fill=#292e42] $palabra#[align=absolute-centre]$quipu#[align=right]$gato "

# Pane borders
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# Allow apps to detect terminal focus changes (improves Neovim autoread support)
set-option -s focus-events on

# Pass modified keys (S-Enter, C-Tab, ...) to applications that request them
set -s extended-keys on
set -s extended-keys-format csi-u

# Enable extended keys and OSC 8 hyperlinks in kitty (fixed index: no
# duplicate on reload)
set -s terminal-features[10] 'xterm-kitty:extkeys:hyperlinks'

# ===== Key mappings =====

# Source tmux configuration from an active session
bind r source-file ~/.tmux.conf \; \
    display-message "Reloaded tmux configuration"

# Let tmux integrate with the system clipboard when available.
set -g set-clipboard on
set -g allow-passthrough on

# Copy WAYLAND_DISPLAY from attaching clients, also when the server started
# without it. The fixed index keeps a reload from adding a duplicate entry.
set -g 'update-environment[100]' WAYLAND_DISPLAY

bind C-c copy-mode
bind C-v paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Panes: split windows
bind - split-window -v -c '#{pane_current_path}'
bind . split-window -h -c '#{pane_current_path}'
unbind '"'
unbind %

# Panes: adjust size (coarse)
bind -r C-Left resize-pane -L 2
bind -r C-Right resize-pane -R 2
bind -r C-Down resize-pane -D 1
bind -r C-Up resize-pane -U 1

# Panes: adjust size (fine)
bind -r S-Left resize-pane -L 10
bind -r S-Right resize-pane -R 10
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5

# Swap a pane (targeted by pane number) with the current pane
bind s display-panes "swap-pane -t '%%'"

# Panes: break pane out to a new window
bind b break-pane -d

# Panes: navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Windows: create new window
bind c new-window -c "#{pane_current_path}"

# Windows: navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Session: choose session, window or pane interactively
bind C-j choose-tree

# Git: lazygit and tig in a popup over the current pane, in its directory
bind g display-popup -d '#{pane_current_path}' -E -w 95% -h 95% lazygit
bind t display-popup -d '#{pane_current_path}' -E -w 95% -h 95% tig

# Projects: switch to a project's window, or create it (~/.local/bin/proj)
bind P display-popup -E -w 80% -h 60% proj

# Quipu: the legend of the cords, by key or by a click on the cords
# (-EE keeps the popup open if quipu fails, so that the error stays visible)
%hidden quipu_legend="display-popup -EE -b rounded -S 'fg=#3b4261' -T '#[fg=#7aa2f7] quipu ' -w 72 -h 17 '~/.local/bin/quipu legend --margin=$quipu_margin'"
bind Q run -C "$quipu_legend"
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},quipu}' {
    run -C "$quipu_legend"
} {
    switch-client -t =
}

# Open the URLs on the current pane in urlscan, in a new window
bind u run-shell 'tmp_file=$(mktemp "${XDG_RUNTIME_DIR:-/tmp}/tmux-buffer.XXXXXX") || exit 1; tmux capture-pane -p > "$tmp_file"; tmux new-window -n "urlscan" "sh -c '\''urlscan < \"$1\"; rm -f \"$1\"'\'' sh \"$tmp_file\""'
