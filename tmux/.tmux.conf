# ===== Basic settings =====

# Prefix key (Ctrl+S; flow control is disabled in ~/.bashrc via `stty -ixon`)
set -g prefix C-s
unbind C-b
bind -r C-s send-prefix

# Sensible defaults
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
set -g history-limit 10000
set -g mouse on
set -s escape-time 0

set -g base-index 1
setw -g pane-base-index 1

setw -g mode-keys vi
set -g renumber-windows on

# Status bar (Tokyo Night colours, as in the tmux extra of
# folke/tokyonight.nvim; kitty uses the same palette)
set -g status-style 'fg=#7aa2f7,bg=#16161e'
set -g message-style 'fg=#7aa2f7,bg=#3b4261'
set -g status-left-length 50
set -g status-right-length 50
set -g status-left ''
set -g status-right " %a %F | %H:%M "

# Second status line: palabra on the left, gato on the right (22 columns, as
# `status-right`), by full path since `#()` runs in the server's environment.
# gato events: busy at a load average >= CPU count, bell from any window,
# idle after 10 minutes. `%%s` because tmux applies strftime. Name and
# birthday as in bash/.bashrc.
set-environment -g GATO_NAME DK
set-environment -g GATO_BIRTHDAY 02-25
%hidden gato_bell='#{?#{W:#{?window_bell_flag,1,}},--event bell,}'
%hidden gato_busy='$(test $(cut -d. -f1 /proc/loadavg) -ge $(nproc) && echo --event busy)'
%hidden gato_idle='$(test $(($(date +%%s) - #{client_activity})) -gt 600 && echo --event idle)'
%hidden palabra='#(~/.local/bin/palabra --line)'
%hidden gato="#(~/.local/bin/gato --tmux --width 22 $gato_bell $gato_busy $gato_idle)"
set -g status 2
set -g 'status-format[1]' "#[fg=#c0caf5,bg=#292e42,fill=#292e42] $palabra#[align=right]$gato "

# Pane borders
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# Allow apps to detect terminal focus changes (improves Neovim autoread support)
set-option -s focus-events on

# Pass modified keys (S-Enter, C-Tab, ...) to applications that request them
set -s extended-keys on
set -s extended-keys-format csi-u

# ===== Key mappings =====

# Source tmux configuration from an active session
bind r source-file ~/.tmux.conf \; \
    display-message "Reloaded tmux configuration"

# Let tmux integrate with the system clipboard when available.
set -g set-clipboard on
set -g allow-passthrough on

bind C-c copy-mode
bind C-v paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Panes: split windows
bind - split-window -v -c '#{pane_current_path}'
bind . split-window -h -c '#{pane_current_path}'
unbind '"'
unbind %

# Panes: adjust size (coarse)
bind -r C-Left resize-pane -L 2
bind -r C-Right resize-pane -R 2
bind -r C-Down resize-pane -D 1
bind -r C-Up resize-pane -U 1

# Panes: adjust size (fine)
bind -r S-Left resize-pane -L 10
bind -r S-Right resize-pane -R 10
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5

# Swap a pane (targeted by pane number) with the current pane
bind s display-panes \; \
    command-prompt -p "Swap pane #:"  "swap-pane -t '%%'"

# Panes: break pane out to a new window
bind b break-pane -d

# Panes: navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Windows: create new window
bind c new-window -c "#{pane_current_path}"

# Windows: navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Session: choose session, window or pane interactively
bind C-j choose-tree

bind-key K run-shell 'tmux switch-client -n \; kill-session -t "$(tmux display-message -p "#S")" || tmux kill-session'

bind-key u run-shell 'tmp_file=$(mktemp "${XDG_RUNTIME_DIR:-/tmp}/tmux-buffer.XXXXXX") || exit 1; tmux capture-pane -p > "$tmp_file"; tmux new-window -n "urlscan" "sh -c '\''urlscan < \"$1\"; rm -f \"$1\"'\'' sh \"$tmp_file\""'
