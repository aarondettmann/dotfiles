#? Config file for btop v.1.4.6
#
# Only settings that differ from the defaults are listed; `btop
# --default-config` prints the full set. Missing keys take their default
# values.

#* Name of a btop++/bpytop/bashtop formatted ".theme" file, "Default" and "TTY" for builtin themes.
color_theme = "tokyo-storm.theme"

#* Set to True to enable "h,j,k,l,g,G" keys for directional control in lists.
#* Conflicting keys for h:"help" and k:"kill" is accessible while holding shift.
vim_keys = true

#* Update time in milliseconds, recommended 2000 ms or above for better sample times for graphs.
update_ms = 1000

#* Use a darkening gradient in the process list.
proc_gradient = false

#* In tree-view, always accumulate child process resources in the parent process.
proc_aggregate = true

#* Use base 10 for bits/bytes sizes, KB = 1000 instead of KiB = 1024.
base_10_sizes = true

#* Do not write settings changed in the UI back to this file on exit: it is a
#* symlink into the dotfiles repository, and btop would write every setting.
save_config_on_exit = false
